# Separate Compose project: isolated network, LocalStack state, Redis state and host ports.
name: ai-interview-supabase

# Shared by the api and worker services; SUPABASE_SECRET_KEY stays API-only.
x-supabase-env: &supabase-env
  SPRING_PROFILES_ACTIVE: supabase
  DATABASE_URL: ${DATABASE_URL:?Set the runtime DATABASE_URL in .env.supabase}
  DATABASE_USERNAME: ${DATABASE_USERNAME:?Set the runtime DATABASE_USERNAME in .env.supabase}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set the runtime DATABASE_PASSWORD in .env.supabase}
  DATABASE_MAX_POOL_SIZE: ${DATABASE_MAX_POOL_SIZE:-4}
  SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env.supabase}
  SUPABASE_SSL_ROOT_CERT: /etc/supabase/prod-ca-2021.crt
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-ai-interview:supabase:}
  S3_ENDPOINT: http://localstack:4566
  S3_REGION: us-east-1
  S3_BUCKET: ${S3_BUCKET:-ai-interview-supabase}
  S3_ACCESS_KEY: test
  S3_SECRET_KEY: test
  SQS_ENDPOINT: http://localstack:4566
  SQS_REGION: us-east-1
  SQS_ACCESS_KEY: test
  SQS_SECRET_KEY: test
  SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-ai-interview-supabase-jobs}
  SQS_DLQ_NAME: ${SQS_DLQ_NAME:-ai-interview-supabase-jobs-dlq}
  SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-3}
  JOB_VISIBILITY_TIMEOUT_SECONDS: ${JOB_VISIBILITY_TIMEOUT_SECONDS:-300}
  JOB_LONG_POLL_SECONDS: ${JOB_LONG_POLL_SECONDS:-20}
  GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env.ai-serving}
  GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:?Set GEMINI_CHAT_MODEL in .env.ai-serving}
  GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:?Set GEMINI_EMBEDDING_MODEL in .env.ai-serving}
  AI_CHAT_MODEL: ${AI_CHAT_MODEL:?Set AI_CHAT_MODEL in .env.ai-serving}
  AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-gemini}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:?Set AI_EMBEDDING_MODEL in .env.ai-serving}
  RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:?Set RAG_EMBEDDING_DIMENSIONS in .env.ai-serving}

services:
  postgres:
    # A stray --profile app must not start the bundled database in this stack.
    profiles: !override [managed-postgres]

  redis:
    container_name: ai-interview-supabase-redis
    ports: !override
      - "127.0.0.1:${SUPABASE_REDIS_PUBLISHED_PORT:-16380}:6379"

  localstack:
    container_name: ai-interview-supabase-localstack
    ports: !override
      - "127.0.0.1:${SUPABASE_LOCALSTACK_PUBLISHED_PORT:-14566}:4566"
    environment: !override
      SERVICES: s3,sqs
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-ai-interview-supabase-jobs}
      SQS_DLQ_NAME: ${SQS_DLQ_NAME:-ai-interview-supabase-jobs-dlq}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-3}
      JOB_VISIBILITY_TIMEOUT_SECONDS: ${JOB_VISIBILITY_TIMEOUT_SECONDS:-300}
      JOB_LONG_POLL_SECONDS: ${JOB_LONG_POLL_SECONDS:-20}

  api:
    profiles: !override [supabase]
    env_file: !override []
    container_name: ai-interview-supabase-api
    environment: !override
      <<: *supabase-env
      JOB_RUNTIME_MODE: api
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Set the API key in .env.supabase}
    depends_on: !override
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    volumes: !override
      - type: bind
        source: ${SUPABASE_SSL_ROOT_CERT:?Set the host CA path in .env.supabase}
        target: /etc/supabase/prod-ca-2021.crt
        read_only: true

  worker:
    profiles: !override [supabase]
    env_file: !override []
    container_name: ai-interview-supabase-worker
    environment: !override
      <<: *supabase-env
      JOB_RUNTIME_MODE: worker
    depends_on: !override
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    volumes: !override
      - type: bind
        source: ${SUPABASE_SSL_ROOT_CERT:?Set the host CA path in .env.supabase}
        target: /etc/supabase/prod-ca-2021.crt
        read_only: true

  web:
    profiles: !override [supabase]
    container_name: ai-interview-supabase-web
    ports: !override
      - "127.0.0.1:${SUPABASE_WEB_PUBLISHED_PORT:-13000}:3000"
    environment:
      API_UPSTREAM: http://api:8080
    depends_on: !override
      api:
        condition: service_healthy
