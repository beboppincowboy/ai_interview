spring:
  config:
    # The private .env.supabase file is bootstrap-only; serving processes must not import it.
    import: optional:file:.env[.properties]
  application:
    name: ai_interview
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/interview_guide}
    username: ${DATABASE_USERNAME:ai_interview}
    password: ${DATABASE_PASSWORD:ai_interview}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: ${RESUME_MAX_FILE_SIZE:10MB}
      max-request-size: ${RESUME_MAX_REQUEST_SIZE:12MB}
  flyway:
    enabled: true
    baseline-on-migrate: true
  ai:
    model:
      chat: ${AI_CHAT_MODEL:google-genai}
      embedding:
        text: ${AI_EMBEDDING_MODEL:google-genai}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-3.6-flash}
            temperature: ${GEMINI_CHAT_TEMPERATURE:0.2}
        embedding:
          api-key: ${GEMINI_API_KEY:}
          text:
            options:
              model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
              task-type: RETRIEVAL_DOCUMENT
              dimensions: ${RAG_EMBEDDING_DIMENSIONS:1024}
    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: ${RAG_EMBEDDING_DIMENSIONS:1024}
        schema-name: public
        table-name: vector_store

server:
  # Tomcat takes the client address from X-Forwarded-For sent by private-network proxies (nginx, the Vite dev proxy),
  # so RedisRequestGuard rate-limits the real client. nginx overwrites the header, so clients cannot forge it.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  ai:
    # gemini (default) or openai; embeddings always stay on Gemini.
    chat-provider: ${AI_CHAT_PROVIDER:gemini}
  openai:
    api-key: ${OPENAI_API_KEY:}
    temperature: ${OPENAI_TEMPERATURE:0.2}
    request-timeout-seconds: ${OPENAI_REQUEST_TIMEOUT_SECONDS:90}
    max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:4096}
  supabase:
    enabled: ${SUPABASE_SDK_ENABLED:false}
    url: ${SUPABASE_URL:}
    secret-key: ${SUPABASE_SECRET_KEY:}
  runtime:
    mode: ${JOB_RUNTIME_MODE:all}
  gemini:
    request-timeout-seconds: ${GEMINI_REQUEST_TIMEOUT_SECONDS:90}
    max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:4096}
    thinking-budget: ${GEMINI_THINKING_BUDGET:0}
    thinking-level: ${GEMINI_THINKING_LEVEL:medium}
  rag:
    embedding-dimensions: ${RAG_EMBEDDING_DIMENSIONS:1024}
    default-top-k: ${RAG_DEFAULT_TOP_K:8}
    resume-candidate-top-k: ${RAG_RESUME_CANDIDATE_TOP_K:6}
    job-description-candidate-top-k: ${RAG_JOB_DESCRIPTION_CANDIDATE_TOP_K:4}
    assessment-context-budget: ${RAG_ASSESSMENT_CONTEXT_BUDGET:14}
    question-context-budget: ${RAG_QUESTION_CONTEXT_BUDGET:16}
    feedback-context-budget: ${RAG_FEEDBACK_CONTEXT_BUDGET:10}
    assessment-job-description-minimum: ${RAG_ASSESSMENT_JD_MINIMUM:3}
    question-job-description-minimum: ${RAG_QUESTION_JD_MINIMUM:3}
    feedback-job-description-minimum: ${RAG_FEEDBACK_JD_MINIMUM:2}
    section-maximum: ${RAG_SECTION_MAXIMUM:3}
    rrf-k: ${RAG_RRF_K:15}
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
    chunk-schema: ${RAG_CHUNK_SCHEMA:section-block-v3}
  redis:
    key-prefix: ${REDIS_KEY_PREFIX:ai-interview:v3:}
    rate-limit:
      enabled: ${REDIS_RATE_LIMIT_ENABLED:true}
      window-seconds: ${REDIS_RATE_LIMIT_WINDOW_SECONDS:60}
      ai-limit: ${REDIS_AI_RATE_LIMIT:12}
      upload-limit: ${REDIS_UPLOAD_RATE_LIMIT:20}
    idempotency:
      enabled: ${REDIS_IDEMPOTENCY_ENABLED:true}
      ttl-seconds: ${REDIS_IDEMPOTENCY_TTL_SECONDS:86400}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:4566}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:ai-interview}
    access-key: ${S3_ACCESS_KEY:test}
    secret-key: ${S3_SECRET_KEY:test}
    pending-retention-hours: ${RESUME_PENDING_RETENTION_HOURS:24}
    cleanup-interval-ms: ${RESUME_STORAGE_CLEANUP_INTERVAL_MS:300000}
  resume-extraction:
    queue-capacity: ${RESUME_PARSER_QUEUE_CAPACITY:2}
    timeout-seconds: ${RESUME_EXTRACTION_TIMEOUT_SECONDS:20}
    max-parse-chars: ${RESUME_MAX_PARSE_CHARS:250000}
    max-pdf-pages: ${RESUME_MAX_PDF_PAGES:50}
    max-embedded-resources: ${RESUME_MAX_EMBEDDED_RESOURCES:20}
  jobs:
    enabled: ${JOBS_ENABLED:true}
    endpoint: ${SQS_ENDPOINT:http://localhost:4566}
    region: ${SQS_REGION:us-east-1}
    access-key: ${SQS_ACCESS_KEY:test}
    secret-key: ${SQS_SECRET_KEY:test}
    queue-name: ${SQS_QUEUE_NAME:ai-interview-jobs}
    dlq-name: ${SQS_DLQ_NAME:ai-interview-jobs-dlq}
    max-receive-count: ${SQS_MAX_RECEIVE_COUNT:3}
    worker-concurrency: ${JOB_WORKER_CONCURRENCY:2}
    long-poll-seconds: ${JOB_LONG_POLL_SECONDS:20}
    visibility-timeout-seconds: ${JOB_VISIBILITY_TIMEOUT_SECONDS:300}
    heartbeat-seconds: ${JOB_HEARTBEAT_SECONDS:60}
    max-attempts: ${JOB_MAX_ATTEMPTS:3}
    retry-base-seconds: ${JOB_RETRY_BASE_SECONDS:15}
    dispatch-interval-ms: ${JOB_DISPATCH_INTERVAL_MS:5000}
    lease-reaper-interval-ms: ${JOB_LEASE_REAPER_INTERVAL_MS:30000}
    cleanup-interval-ms: ${JOB_CLEANUP_INTERVAL_MS:3600000}
    shutdown-grace-seconds: ${JOB_SHUTDOWN_GRACE_SECONDS:120}
    retention-days: ${JOB_RETENTION_DAYS:7}
